# APP TECH — إعدادات النشر على Netlify
# البناء: Vite → dist

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA fallback ──
# أي مسار مش موجود كملف حقيقي بيروح لـ index.html (status 200 = rewrite مش redirect).
# نتلفاي بيقدّم الملفات الحقيقية الأول (assets/، og-image.jpg، الأيقونات...)
# فالقاعدة دي ما بتخطفش الملفات الموجودة فعلًا.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── الكاش: أصول build مبصومة بهاش، تتكاش سنة كاملة ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── index.html لازم يتراجع دايمًا عشان النسخ الجديدة تظهر ──
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── og-image ──
[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=3600"

# ── هيدرات أمان على كل المسارات ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── Edge function لبطاقات مشاركة الأجهزة ──
[[edge_functions]]
  function = "device-og"
  path = "/d/*"
